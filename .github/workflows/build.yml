name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Configure
        run: |
          VMTK_DIR=$(pixi run bash -c 'echo $CONDA_PREFIX')
          pixi run cmake -G Ninja \
            -S . \
            -B build/app \
            -DCMAKE_BUILD_TYPE=Release \
            -DVMTK_DIR="$VMTK_DIR"

      - name: Build
        run: pixi run cmake --build build/app --parallel 4

      - name: Test
        run: pixi run ctest --test-dir build/app --output-on-failure
