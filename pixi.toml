[workspace]
name = "vessel-centerline-extraction"
version = "2.0.0"
description = "Interactive vessel centerline extraction using VTK and VMTK"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
cmake = ">=3.16"
ninja = "*"
vtk = ">=9.0"
libitk = "*"
libitk-devel = "*"

[target.osx-arm64.dependencies]
c-compiler = "*"
cxx-compiler = "*"

[target.linux-64.dependencies]
c-compiler = "*"
cxx-compiler = "*"
mesa-libgl-devel-cos7-x86_64 = "*"
vmtk = "*"
eigen = "<5"

# Windows: VMTK has prebuilt conda-forge packages — no source build needed.
# Pin eigen <5: win-64 vmtk/libitk packages were built against Eigen 3.x;
# conda-forge Eigen 5.x is a new major version whose cmake config is
# incompatible with ITK's find_package(Eigen3 3.3) check.
[target.win-64.dependencies]
cxx-compiler = "*"
c-compiler = "*"
vmtk = "*"
eigen = "<5"

[tasks]
# macOS arm64 only: build VMTK from source (no conda-forge package for arm64)
build-vmtk = { cmd = "bash scripts/build-vmtk.sh" }
configure = { cmd = "cmake -G Ninja -S . -B build/app -DCMAKE_BUILD_TYPE=Release -DVMTK_DIR=build/vmtk-install/lib", depends-on = ["build-vmtk"] }
build = { cmd = "cmake --build build/app --parallel", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build/app --output-on-failure", depends-on = ["build"] }
all = { depends-on = ["test"] }

# Linux: conda-forge vmtk available — no source build needed
[target.linux-64.tasks]
build-vmtk = "echo 'Linux: using conda-forge VMTK, skipping source build'"
configure = { cmd = "cmake -G Ninja -S . -B build/app -DCMAKE_BUILD_TYPE=Release -DVMTK_DIR=$CONDA_PREFIX", depends-on = ["build-vmtk"] }
